name: Keep Render Backend Alive

on:
  schedule:
    # Run every 13 minutes
    - cron: '*/13 * * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend health endpoint
        run: |
          curl -fsS https://league-backend-ot61.onrender.com/health || true
          echo "Keep-alive ping completed at $(date)"

